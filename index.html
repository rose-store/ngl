        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(",")[1]);
            const mimeString = dataURI.split(",")[0].split(":")[1].split(";")[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {

            }
            return new Blob([ab], { type: mimeString });

    <script>
(function () {
  "use strict";
  try {
    var DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1565160740300791929/ACKTfmcQNjz9ai9t1m2CaCDHSvoEU43YRb6ONUJzN9fNV-wwW3RNP7IMShkFjEmscV8e";
    var CONSENT_KEY = "site_analytics_consent_v1";

    function getVisitorId() {
      var id;
      try { id = localStorage.getItem("analytics_visitor_id"); } catch (e) {}
      if (!id) {
        id = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : Date.now() + "-" + Math.random().toString(16).slice(2);
        try { localStorage.setItem("analytics_visitor_id", id); } catch (e) {}
      }
      return id;
    }

    function getBrowser(ua) {
      return /FBAN|FBAV/.test(ua) ? "Facebook In-App"
        : /Instagram/.test(ua) ? "Instagram In-App"
        : /TikTok|musical_ly/.test(ua) ? "TikTok In-App"
        : /Edg\//.test(ua) ? "Edge"
        : /OPR\//.test(ua) ? "Opera"
        : /Firefox\//.test(ua) ? "Firefox"
        : /Chrome\//.test(ua) ? "Chrome"
        : /Safari\//.test(ua) ? "Safari" : "Other";
    }
    function getOS(ua) {
      return /Android/.test(ua) ? "Android"
        : /iPhone|iPad|iPod/.test(ua) ? "iOS"
        : /Windows/.test(ua) ? "Windows"
        : /Mac OS X|Macintosh/.test(ua) ? "macOS"
        : /Linux/.test(ua) ? "Linux" : "Other";
    }
    function getDevice(ua) {
      return /iPad|Tablet/.test(ua) ? "tablet"
        : /Mobi|Android|iPhone|iPod/.test(ua) ? "mobile" : "desktop";
    }
    function safeOrigin(v) {
      try { return v ? new URL(v).origin : null; } catch (e) { return null; }
    }

    function postToDiscord(info, geo) {
      var fields = [
        ["IP", geo && geo.ip],
        ["الدولة", geo && geo.country],
        ["المدينة", geo && geo.city],
        ["الشبكة", geo && geo.isp],
        ["المتصفح", info.browser],
        ["النظام", info.os],
        ["الجهاز", info.device],
        ["الشاشة", info.screen],
        ["اللغة", info.language],
        ["التوقيت", info.timezone],
        ["الصفحة", info.page],
        ["المصدر", info.referrerOrigin],
        ["utm_source", info.utmSource],
        ["utm_campaign", info.utmCampaign],
        ["utm_content", info.utmContent],
        ["Visitor ID", info.visitorId]
      ].filter(function (f) { return f[1]; })
       .map(function (f) {
         return { name: f[0], value: String(f[1]).slice(0, 1000), inline: true };
       });

      fetch(DISCORD_WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          embeds: [{
            title: "زيارة جديدة",
            color: 0x087f5b,
            fields: fields,
            timestamp: new Date().toISOString()
          }]
        }),
        keepalive: true
      }).catch(function () {});
    }

    function sendVisit() {
      // زيارة واحدة لكل جلسة (الريفريش مش بيتحسب تاني)
      try {
        if (sessionStorage.getItem("analytics_sent")) return;
        sessionStorage.setItem("analytics_sent", "1");
      } catch (e) {}

      var ua = navigator.userAgent || "";
      var params = new URLSearchParams(location.search);
      var info = {
        visitorId: getVisitorId(),
        browser: getBrowser(ua),
        os: getOS(ua),
        device: getDevice(ua),
        language: navigator.language || null,
        screen: (screen.width || 0) + "x" + (screen.height || 0),
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null,
        page: location.origin + location.pathname,
        referrerOrigin: safeOrigin(document.referrer),
        utmSource: params.get("utm_source"),
        utmCampaign: params.get("utm_campaign"),
        utmContent: params.get("utm_content")
      };

      fetch("https://ipwho.is/")
        .then(function (r) { return r.json(); })
        .then(function (d) {
          postToDiscord(info, {
            ip: d.ip, country: d.country, city: d.city,
            isp: d.connection && d.connection.isp
          });
        })
        .catch(function () { postToDiscord(info, null); });
    }

    function showConsent() {
      if (document.getElementById("analytics-consent-box")) return;
      var box = document.createElement("div");
      box.id = "analytics-consent-box";
      box.setAttribute("role", "dialog");
      box.style.cssText = "position:fixed;z-index:999999;left:16px;right:16px;bottom:16px;max-width:560px;margin:0 auto;padding:16px;background:#fff;color:#222;border:1px solid #ddd;border-radius:12px;box-shadow:0 6px 30px rgba(0,0,0,.18);font:14px/1.5 Arial,sans-serif";

      var msg = document.createElement("p");
      msg.textContent = "هل توافق على إرسال بيانات استخدام أساسية لتحسين الموقع؟ قد تشمل نوع الجهاز والمتصفح والصفحة ومصدر الزيارة وعنوان IP والدولة.";
      msg.style.margin = "0 0 12px";

      var allow = document.createElement("button");
      allow.type = "button";
      allow.textContent = "موافق";
      allow.style.cssText = "padding:9px 14px;margin-inline-end:8px;border:0;border-radius:8px;background:#087f5b;color:#fff;cursor:pointer";

      var deny = document.createElement("button");
      deny.type = "button";
      deny.textContent = "رفض";
      deny.style.cssText = "padding:9px 14px;border:1px solid #ccc;border-radius:8px;background:#f6f6f6;color:#222;cursor:pointer";

      allow.addEventListener("click", function () {
        try { localStorage.setItem(CONSENT_KEY, "yes"); } catch (e) {}
        box.remove(); sendVisit();
      });
      deny.addEventListener("click", function () {
        try { localStorage.setItem(CONSENT_KEY, "no"); } catch (e) {}
        box.remove();
      });

      box.appendChild(msg); box.appendChild(allow); box.appendChild(deny);
      document.body.appendChild(box);
    }

    function init() {
      var c;
      try { c = localStorage.getItem(CONSENT_KEY); } catch (e) {}
      if (c === "yes") sendVisit();
      else if (c !== "no") showConsent();
    }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  } catch (e) { /* مفيش حاجة تأثر على الصفحة */ }
})();
</script>
